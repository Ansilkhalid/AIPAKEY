name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app libraries
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Generate app icon
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#1F6F5C" --iconBackgroundColorDark "#1F6F5C" --splashBackgroundColor "#EEF1F4" --splashBackgroundColorDark "#121A23"

      - name: Add permissions and version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/patch-android.js

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Use the fixed signing key (keeps updates installable over the old app)
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build the APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "AIPAKeys-1.0.${{ github.run_number }}.apk"

      - name: Keep the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: AIPAKeys-APK
          path: AIPAKeys-1.0.${{ github.run_number }}.apk

      - name: Publish a release for easy download on the tablet
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AIPA Keys 1.0.${{ github.run_number }}
          files: AIPAKeys-1.0.${{ github.run_number }}.apk
